<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/cart.css">
    <title>cart</title>
</head>
<body class="body">

<div class="card">
    <div class="row">
        <div class="col-md-8 cart">
            <div class="title">
                <div class="row">
                    <div class="col"><h4><b>Shopping Cart</b></h4></div>
                    <div class="col align-self-center text-right text-muted"><span th:text="${dettalles.size()}"></span> items</div>
                </div>
            </div>

            <div th:each="d : ${dettalles}">
                <div class="row border-top border-bottom">
                    <div class="row main align-items-center">
                        <div class="col-2"><img class="img-fluid" src="https://i.imgur.com/1GrakTl.jpg"></div>
                        <div class="col">
                            <div class="row text-muted" th:text="${d.producto.nombre}">Shirt</div>
                            <div class="row" th:text="${d.producto.descripcion}">Cotton T-shirt</div>
                        </div>
                        <div class="col">
                            <a href="#">-</a><a href="#" class="border">1</a><a href="#">+</a>
                        </div>
                        <div class="col">$<span th:text="${d.producto.valorUnitario}"></span> <span class="close">&#10005;</span></div>
                    </div>
                </div>
            </div>


            <div class="back-to-shop"><a href="/tienda">&leftarrow;</a><span class="text-muted">Regresar a la tienda</span></div>
        </div>
        <div class="col-md-4 summary">
            <div><h5><b>Factura</b></h5></div>
            <hr>
            <div class="row">
                <div class="col" style="padding-left:0;">SubTotal</div>
                <div class="col text-right" th:text="${encabezado.getSubtotal()}">&euro;</div>
            </div>

            <div class="row" style="border-top: 1px solid rgba(0,0,0,.1); padding: 2vh 0;">
                <div class="col">Precio total</div>
                $<div class="col text-right" th:text="${encabezado.getTotal()}">$</div>
            </div>
            <a th:href="@{/factura/} + ${encabezado.getId()}">
                <button class="btn">Pagar</button>
            </a>

        </div>
    </div>

</div>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</body>
</html>
